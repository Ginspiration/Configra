<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configra</title>
    <script>
      try {
        const preference = localStorage.getItem('configra:theme-preference') || 'system';
        const theme = preference === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f4f6f8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #101827; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
