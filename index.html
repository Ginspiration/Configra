<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configra</title>
    <script>
      try {
        const preference = localStorage.getItem('configra:theme-preference') || 'system';
        const theme = preference === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; height: 100%; background: #f4f6f8; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #101827; }
      .boot-screen { display: grid; height: 100%; min-height: 320px; place-items: center; }
      .boot-card { width: 304px; max-width: calc(100% - 64px); border: 1px solid #d5dce3; border-radius: 12px; background: #fff; box-shadow: 0 24px 70px rgb(15 23 42 / 16%); padding: 28px; }
      .boot-brand { display: flex; align-items: center; gap: 12px; color: #18212c; font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; }
      .boot-logo { display: grid; width: 24px; height: 24px; align-content: center; gap: 4px; border: 1px solid #7ca4f1; border-radius: 9px; background: #eaf1fe; padding: 9px; }
      .boot-logo span { display: block; height: 3px; border-radius: 999px; background: #2563eb; }
      .boot-logo span:nth-child(2) { width: 72%; }
      .boot-logo span:nth-child(3) { width: 44%; }
      .boot-progress { height: 3px; margin-top: 54px; overflow: hidden; border-radius: 999px; background: #eef2f5; }
      .boot-progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: #2563eb; animation: boot-progress 1.25s ease-in-out infinite; }
      html[data-theme="dark"] .boot-card { border-color: #334155; background: #172033; }
      html[data-theme="dark"] .boot-brand { color: #e5edf7; }
      html[data-theme="dark"] .boot-logo { border-color: #496f9e; background: #1c314f; }
      html[data-theme="dark"] .boot-logo span, html[data-theme="dark"] .boot-progress span { background: #60a5fa; }
      html[data-theme="dark"] .boot-progress { background: #202c40; }
      @keyframes boot-progress { from { transform: translateX(-110%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .boot-progress span { width: 100%; animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-busy="true" aria-label="Configra 正在启动">
        <section class="boot-card">
          <div class="boot-brand">
            <div class="boot-logo" aria-hidden="true"><span></span><span></span><span></span></div>
            <span>Configra</span>
          </div>
          <div class="boot-progress" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>
    <div id="portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
